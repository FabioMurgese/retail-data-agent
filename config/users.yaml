# Demo identities for the CLI (`retail-agent chat --user <id>`) and their data access.
# In production identity comes from the IdP and this mapping from an access table or entitlement service.
#
# Access is by brand only: each manager is responsible for one or more brands and sees every product,
# order and customer connected to those brands. The CEO sees everything (`all_products: true`).
# Products without a brand belong to no manager's portfolio, so only `all_products` users see them.
#
# Brand names are case-sensitive and must match BigQuery exactly ("Calvin Klein" and "Calvin Klein
# Jeans" are different brands); `retail-agent doctor` checks every name against live data.

users:
  ceo:
    display_name: Morgan
    role: Chief Executive Officer
    scope:
      all_products: true

  alice:
    display_name: Alice
    role: Brand Manager, Premium Denim
    scope:
      brands: [7 For All Mankind, True Religion, Joe's Jeans, AG Adriano Goldschmied]

  bob:
    display_name: Bob
    role: Brand Manager, Outdoor
    scope:
      brands: [The North Face, Columbia, Arc'teryx, Canada Goose, Mountain Hardwear]

  carol:
    display_name: Carol
    role: Brand Partnerships Lead
    scope:
      brands: [Calvin Klein, Levi's, Tommy Hilfiger]

  dan:
    display_name: Dan
    role: Brand Manager, Carhartt
    scope:
      brands: [Carhartt]
