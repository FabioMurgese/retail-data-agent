id: candidate-bd1b988fdd70
question: Which product categories have the highest return rate for my brand?
author: dan (via /good)
created: 2026-11-16
trace_id: bd1b988fdd70
warnings: []
sql: |
  SELECT
    p.category,
    COUNT(*) AS items_delivered,
    COUNTIF(oi.status = 'Returned') AS items_returned,
    ROUND(COUNTIF(oi.status = 'Returned') / COUNT(*), 4) AS return_rate
  FROM order_items AS oi
  JOIN products AS p ON p.id = oi.product_id
  WHERE p.brand = 'Carhartt'
    AND oi.status IN ('Complete', 'Returned')
  GROUP BY p.category
  ORDER BY return_rate DESC
other_queries:
- |
  SELECT DISTINCT brand FROM products WHERE brand LIKE '%Carhartt%'
- |
  SELECT
    p.category,
    COUNT(*) AS items_delivered,
    COUNTIF(oi.status = 'Returned') AS items_returned,
    ROUND(COUNTIF(oi.status = 'Returned') / COUNT(*), 4) AS return_rate
  FROM order_items AS oi
  JOIN products AS p ON p.id = oi.product_id
  WHERE p.brand = 'Carhartt'
    AND oi.status IN ('Complete', 'Returned')
  GROUP BY p.category
  HAVING items_delivered >= 50
  ORDER BY return_rate DESC
  LIMIT 10
