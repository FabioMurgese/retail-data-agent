id: average-delivery-days-by-month
question: How many days does it take on average for orders to be delivered, month by month this year?
tags:
- delivery-time
- fulfillment
- orders
- logistics
- shipping
- performance
author: automatic curation
created: 2026-11-16
status: approved
source: candidate-f5ec1bb1ffe5 (dan (via /good), trace f5ec1bb1ffe5)
metrics:
- delivered_orders
- avg_delivery_days
sql: |
  SELECT
    DATE_TRUNC(DATE(o.created_at), MONTH) AS month,
    COUNT(o.order_id) AS delivered_orders,
    ROUND(AVG(TIMESTAMP_DIFF(o.delivered_at, o.created_at, HOUR)) / 24.0, 1) AS avg_delivery_days
  FROM orders AS o
  WHERE
    o.status = 'Complete'
    AND NOT o.delivered_at IS NULL
    AND DATE(o.created_at) >= DATE_TRUNC(CURRENT_DATE, YEAR)
  GROUP BY
    month
  ORDER BY
    month
report: |
  Delivery time is measured in days from order creation to delivery timestamp for completed orders. This query evaluates fulfillment performance trends over the current year on a monthly basis. Watch out for low-volume months where a few outlier shipments can skew the average. Follow-up queries can break down delivery duration by shipping destination or carrier if available.

