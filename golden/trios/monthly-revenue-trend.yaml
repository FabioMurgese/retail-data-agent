id: monthly-revenue-trend
question: What is our monthly revenue trend over the last year?
tags: [revenue, monthly, trend, time series, orders, average order value, growth]
author: analytics-team
created: 2026-09-14
sql: |
  SELECT
    DATE_TRUNC(DATE(oi.created_at), MONTH) AS month,
    COUNT(DISTINCT oi.order_id) AS orders,
    ROUND(SUM(oi.sale_price), 2) AS net_revenue,
    ROUND(SUM(oi.sale_price) / COUNT(DISTINCT oi.order_id), 2) AS avg_order_value
  FROM order_items AS oi
  WHERE oi.status NOT IN ('Cancelled', 'Returned')
    AND DATE(oi.created_at) >= DATE_TRUNC(DATE_SUB(CURRENT_DATE(), INTERVAL 12 MONTH), MONTH)
  GROUP BY month
  ORDER BY month
report: |
  Last 12 full months plus the current month to date. The current month is incomplete: compare it
  on a per-day run rate or leave it out, and say which. Revenue = orders x average order value, so
  explain every change by saying which of the two moved. Timestamps are UTC.
