[project]
name = "retail-agent"
version = "0.1.0"
description = "Data analysis chat agent for retail executives over BigQuery thelook_ecommerce, powered by Gemini + LangGraph"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "db-dtypes>=1.9.0",
    "google-cloud-bigquery>=3.47.0",
    "langchain-google-genai>=4.5.0",
    "langgraph>=1.2.22",
    "pandas>=3.1.1",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlglot>=30.31.0",
    "typer>=0.29.1",
]

[project.scripts]
retail-agent = "retail_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM905"]  # "a b c".split() is the readable way to write a word list

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
